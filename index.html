<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1A1917">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="focus.">
  <title>focus.</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
  <div class="app">

    <!-- Sidebar (desktop) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="app-name">focus.</h1>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <button class="nav-item" id="nav-this-week" data-view="this-week">
            <span class="nav-icon">◈</span>
            <span>This Week</span>
          </button>
          <button class="nav-item" id="nav-all">
            <span class="nav-icon">○</span>
            <span>See All</span>
          </button>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-section">
          <span class="nav-label">Focus Areas</span>
          <div id="areas-list"></div>
          <button class="nav-item add-area-btn" id="add-area-btn">
            <span class="nav-icon">+</span>
            <span>Add area</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="nav-completed">
          <span class="nav-icon">✓</span>
          <span>Completed</span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="main-header">
        <div class="header-left">
          <button class="back-btn hidden" id="back-btn">←</button>
          <h2 id="view-title">This Week</h2>
          <!-- Mobile-only header links (visibility toggled by updateViewHeader) -->
          <button class="completed-header-link hidden" id="completed-link">Completed ›</button>
          <button class="completed-header-link hidden" id="focus-data-link">focus.</button>
        </div>
        <div class="header-actions">
          <button class="btn-primary" id="add-new-btn">+ New</button>
          <button class="clear-completed-btn hidden" id="clear-completed-btn">Clear all</button>
        </div>
      </div>

      <div id="task-list" class="task-list"></div>
      <div id="empty-state" class="empty-state hidden">
        <p id="empty-state-text">Nothing planned for this week.</p>
      </div>
    </main>

    <!-- Mobile: Areas screen -->
    <div class="areas-screen hidden" id="areas-screen">
      <div class="areas-screen-header">
        <h2>Focus Areas</h2>
        <button class="all-tasks-link" id="mobile-all-tasks">See All ›</button>
      </div>
      <div class="areas-screen-list" id="areas-screen-list"></div>
    </div>

  </div>

  <!-- Mobile: Bottom nav -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-item active" id="mobile-nav-this-week">
      <span class="bottom-nav-label">This Week</span>
    </button>
    <button class="bottom-nav-add" id="mobile-nav-add">
      <div class="bottom-nav-plus-circle">
        <span class="bottom-nav-plus">+</span>
      </div>
    </button>
    <button class="bottom-nav-item" id="mobile-nav-areas">
      <span class="bottom-nav-label">Focus Areas</span>
    </button>
  </nav>

  <!-- Data menu (long-press focus. title) -->
  <div class="data-menu hidden" id="data-menu">
    <button class="data-menu-item" id="data-export">Export data</button>
    <button class="data-menu-item" id="data-import">Import data</button>
  </div>
  <div class="data-menu-overlay hidden" id="data-menu-overlay"></div>
  <input type="file" id="import-file-input" accept=".json" style="display:none">

  <!-- New Modal -->
  <div id="new-modal" class="modal hidden">
    <div class="modal-overlay" id="new-modal-overlay"></div>
    <div class="modal-content">
      <h3>Create new</h3>
      <!-- Title -->
      <div class="form-group">
        <input type="text" id="new-title-input" placeholder="What needs to get done?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>
      <!-- Desktop: area dropdown -->
      <div class="form-group" id="new-area-select-group">
        <label for="new-area-select">Area</label>
        <select id="new-area-select"></select>
      </div>
      <!-- Mobile: area pills -->
      <div class="form-group hidden" id="new-area-pills-group">
        <label>Area</label>
        <div class="area-pills-scroll" id="new-area-pills"></div>
      </div>
      <!-- Three-way toggle: This Week / Later / Habit -->
      <div class="form-group" id="new-type-toggle-group">
        <div class="week-toggle">
          <button class="week-toggle-option" id="new-toggle-this-week">This Week</button>
          <button class="week-toggle-option" id="new-toggle-later">Later</button>
          <button class="week-toggle-option" id="new-toggle-habit">Habit</button>
        </div>
      </div>
      <!-- Weekly target: desktop number input (habit only) -->
      <div class="form-group hidden" id="new-target-input-group">
        <label for="new-target-input">Weekly target</label>
        <input type="text" inputmode="numeric" id="new-target-input" min="1" value="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>
      <!-- Weekly target: mobile counter (habit only) -->
      <div class="form-group hidden" id="new-target-counter-group">
        <label>Weekly target</label>
        <div class="habit-target-counter">
          <button class="counter-btn" id="new-target-decrement">−</button>
          <span class="counter-display" id="new-target-display">1</span>
          <button class="counter-btn" id="new-target-increment">+</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="new-modal-cancel">Cancel</button>
        <button class="btn-primary" id="new-modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Area Modal (Add) -->
  <div id="area-modal" class="modal hidden">
    <div class="modal-overlay" id="area-modal-overlay"></div>
    <div class="modal-content modal-small">
      <h3>New area</h3>
      <div class="form-group">
        <input type="text" id="area-name-input" placeholder="Area name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="area-modal-cancel">Cancel</button>
        <button class="btn-primary" id="area-modal-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Weekly Review Modal -->
  <div id="weekly-review-modal" class="modal hidden">
    <div class="modal-overlay" id="weekly-review-overlay"></div>
    <div class="modal-content modal-small">
      <h3>New week, new start.</h3>
      <div class="weekly-review-stats">
        <div class="weekly-review-stat-row">
          <span class="weekly-review-label">Habits accomplished</span>
          <span class="weekly-review-value" id="weekly-habits-stat">0 / 0</span>
        </div>
        <div class="weekly-review-stat-row">
          <span class="weekly-review-label">Tasks completed</span>
          <span class="weekly-review-value" id="weekly-tasks-stat">0 / 0</span>
        </div>
      </div>
      <p class="weekly-review-question" id="weekly-review-question">Keep unfinished tasks in This Week?</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="weekly-review-remove">Remove from week</button>
        <button class="btn-primary" id="weekly-review-keep">Keep</button>
      </div>
    </div>
  </div>

  <!-- Voice Recording Overlay (shown while holding + to record) -->
  <div class="voice-overlay hidden" id="voice-overlay">
    <div class="voice-overlay-card">
      <div class="voice-mic" id="voice-mic">◉</div>
      <div class="voice-listening-text" id="voice-listening-text">Listening…</div>
      <div class="voice-hint-text">Release to process</div>
    </div>
  </div>

  <!-- Voice Status Toast (transient feedback) -->
  <div class="voice-toast hidden" id="voice-toast"></div>

  <script src="app.js"></script>
  <!-- Service worker intentionally removed — no offline caching. -->
  <!-- To restore: add a service-worker.js with a network-first strategy. -->
</body>
</html>
